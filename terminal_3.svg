<svg width="560" height="268" viewBox="0 0 560 268" xmlns="http://www.w3.org/2000/svg" font-family="Menlo, Monaco, 'SF Mono', Consolas, monospace">
  <defs>
    <clipPath id="roundedWindow">
      <rect x="0" y="0" width="560" height="268" rx="9" ry="9"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedWindow)">
    <!-- body -->
    <rect x="0" y="0" width="560" height="268" fill="#ffffff"/>

    <!-- title bar -->
    <rect x="0" y="0" width="560" height="34" fill="#f0edf1"/>
    <rect x="0" y="33" width="560" height="1" fill="#dcdcdc"/>
    <circle cx="20" cy="17" r="6" fill="#ff5f57"/>
    <circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
    <circle cx="60" cy="17" r="6" fill="#28c840"/>

    <!-- title icon + text, centered as a group -->
    <rect x="198" y="9" width="16" height="16" rx="3" fill="#1d1d1d"/>
    <text x="206" y="21.5" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">&gt;_</text>
    <text x="222" y="21.5" font-size="13" fill="#333333">kirtan@github — zsh</text>

    <!-- line 1: last login -->
    <text x="24" y="60" font-size="14" fill="#3a3a3a" opacity="0">Last login: Sun Aug  2 10:42:07 on ttys000
      <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.3s" fill="freeze"/>
    </text>

    <!-- line 2: prompt -->
    <text x="24" y="84" font-size="14" fill="#111111" opacity="0">kirtan@github ~ % whoami
      <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.3s" fill="freeze"/>
    </text>

    <!-- line 3: output -->
    <text x="24" y="108" font-size="14" fill="#111111" opacity="0">full-stack developer, Surat, India
      <animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.3s" fill="freeze"/>
    </text>

    <!-- line 4: prompt -->
    <text x="24" y="132" font-size="14" fill="#111111" opacity="0">kirtan@github ~ % cat stack.txt
      <animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.3s" fill="freeze"/>
    </text>

    <!-- line 5: output -->
    <text x="24" y="156" font-size="14" fill="#111111" opacity="0">React / Vue / Supabase / Cloudflare / AWS
      <animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.3s" fill="freeze"/>
    </text>

    <!-- line 6: prompt -->
    <text x="24" y="180" font-size="14" fill="#111111" opacity="0">kirtan@github ~ % cat status.txt
      <animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.3s" fill="freeze"/>
    </text>

    <!-- line 7: output -->
    <text x="24" y="204" font-size="14" fill="#111111" opacity="0">building Netpoint (live) / open to fresher roles
      <animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.3s" fill="freeze"/>
    </text>

    <!-- final prompt with cursor -->
    <text x="24" y="228" font-size="14" fill="#111111" opacity="0">kirtan@github ~ %
      <animate id="finalIn" attributeName="opacity" from="0" to="1" begin="3.0s" dur="0.3s" fill="freeze"/>
    </text>
    <rect x="172" y="216" width="8" height="15" fill="#9a9a9a" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="3.0s" dur="0.01s" fill="freeze"/>
      <animate attributeName="opacity" begin="finalIn.end" dur="1s" values="1;0;1" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
