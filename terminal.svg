<svg width="560" height="310" viewBox="0 0 560 310" xmlns="http://www.w3.org/2000/svg" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace">
  <defs>
    <clipPath id="roundedWindow">
      <rect x="0" y="0" width="560" height="310" rx="10" ry="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedWindow)">
    <!-- body -->
    <rect x="0" y="0" width="560" height="310" fill="#151515"/>

    <!-- title bar -->
    <rect x="0" y="0" width="560" height="34" fill="#2b2b2b"/>
    <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
    <circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
    <circle cx="60" cy="17" r="6" fill="#27c93f"/>
    <text x="280" y="21" font-size="12.5" fill="#9da5b4" text-anchor="middle">kirtan@github — zsh</text>

    <!-- line 1: prompt -->
    <text x="24" y="64" font-size="14" opacity="0">
      <tspan fill="#3fb950">kirtan@github ~ % </tspan><tspan fill="#e6e6e6">whoami</tspan>
      <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.4s" fill="freeze"/>
    </text>

    <!-- line 1 output -->
    <text x="24" y="90" font-size="13.5" fill="#8b949e" opacity="0">
      <tspan fill="#a78bfa">→ </tspan>full-stack developer, Surat, India
      <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.4s" fill="freeze"/>
    </text>

    <!-- line 2: prompt -->
    <text x="24" y="130" font-size="14" opacity="0">
      <tspan fill="#3fb950">kirtan@github ~ % </tspan><tspan fill="#e6e6e6">cat stack.txt</tspan>
      <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.4s" fill="freeze"/>
    </text>

    <!-- line 2 output -->
    <text x="24" y="156" font-size="13.5" fill="#8b949e" opacity="0">
      <tspan fill="#a78bfa">→ </tspan>React · Vue · Supabase · Cloudflare · AWS
      <animate attributeName="opacity" from="0" to="1" begin="2.1s" dur="0.4s" fill="freeze"/>
    </text>

    <!-- line 3: prompt -->
    <text x="24" y="196" font-size="14" opacity="0">
      <tspan fill="#3fb950">kirtan@github ~ % </tspan><tspan fill="#e6e6e6">cat status.txt</tspan>
      <animate attributeName="opacity" from="0" to="1" begin="2.7s" dur="0.4s" fill="freeze"/>
    </text>

    <!-- line 3 output -->
    <text x="24" y="222" font-size="13.5" fill="#8b949e" opacity="0">
      <tspan fill="#a78bfa">→ </tspan>building Netpoint (live) · open to fresher roles
      <animate attributeName="opacity" from="0" to="1" begin="3.3s" dur="0.4s" fill="freeze"/>
    </text>

    <!-- final prompt with cursor -->
    <text x="24" y="262" font-size="14" opacity="0">
      <tspan fill="#3fb950">kirtan@github ~ % </tspan>
      <animate id="finalIn" attributeName="opacity" from="0" to="1" begin="3.9s" dur="0.4s" fill="freeze"/>
    </text>
    <rect x="182" y="250" width="9" height="16" fill="#e6e6e6" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="3.9s" dur="0.01s" fill="freeze"/>
      <animate attributeName="opacity" begin="finalIn.end" dur="1s" values="1;0;1" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
